name: '🐘 Gradle testing workflow'

on:
  workflow_dispatch:
    inputs:
      arguments:
        description: 'Command line arguments (as a JSON array)'
        required: true
        default: '["projects", "--quiet"]'
        type: string
      java-version:
        description: 'Java version'
        required: true
        default: '25'
        type: string
      java-distribution:
        description: 'Java distribution'
        required: true
        default: 'temurin'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true
      - run: ./gradlew $ARGS
        env:
          ARGS: ${{ join(fromJSON(inputs.arguments), ' ') }}
